---
- name: Install User Local Node
  homebrew:
    name: node@24
  when: ansible_distribution == 'MacOSX'

- name: Link Node 24 as Default Runtime
  homebrew:
    name: node@24
    state: linked
    install_options:
      - force
      - overwrite
  when: ansible_distribution == 'MacOSX'

- name: Install Bun Tap
  homebrew_tap:
    name: oven-sh/bun

- name: Install Bun
  homebrew:
    name: oven-sh/bun/bun
  when: ansible_distribution == 'MacOSX'


- name: Link Node Zsh Configuration
  file:
    state: link
    src: "{{ dotfiles_dir }}/node/node.zsh"
    dest: "{{ ansible_user_dir }}/.oh-my-zsh/custom/node.zsh"


- name: Install yarn
  npm:
    name: yarn
    global: yes
