# Managed by dotfiles: ssh/claude-agent.conf -> ~/.ssh/config.d/00-claude-agent.conf
#
# Claude Code runs with SSH_AUTH_SOCK pointed at ~/.ssh/claude-agent.sock, a
# persistent agent that holds only the dedicated "Claude Code" key (loaded from
# 1Password at provision time; see claude/claude.yml). The 1Password-generated
# blocks in ~/.ssh/1Password/config pin `IdentitiesOnly yes` per host, which
# tells ssh to ignore every agent key except the pinned 1Password identity,
# including Claude's key. So without this block, Claude can never present its
# own key, even to servers that trust it.
#
# This block lifts that restriction, but ONLY when the Claude agent is the
# active agent, so Claude offers its own key first. Human sessions use the
# 1Password agent, do not match here, and keep `IdentitiesOnly yes`.
#
# Ordering matters: ~/.ssh/config includes config.d/* BEFORE 1Password/config,
# and ssh uses the first-obtained value for IdentitiesOnly, so the 00- dest
# prefix guarantees this wins over the later 1Password block.
#
# Trust model:
#   - Trusted server: add the "Claude Code" pubkey to its authorized_keys.
#     Claude's primary attempt (`ssh <host>`) then succeeds with no Touch ID.
#   - Untrusted server: the primary attempt offers only Claude's key, is
#     rejected, and claude-agent.sock cannot present any 1Password key, so it
#     fails. Escalating to 1Password is a deliberate, separate step that
#     triggers Touch ID and acts as a gate on Claude's access:
#       ssh -o IdentityAgent="$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock" <host>
Match exec "test \"$SSH_AUTH_SOCK\" = \"$HOME/.ssh/claude-agent.sock\""
  IdentitiesOnly no
