---
# SSH configuration module
- name: SSH Configuration Directory
  file:
    path: "{{ ansible_user_dir }}/.ssh/config.d"
    state: directory
    mode: 0700

- name: SSH Configuration
  copy:
    src: ssh.config
    dest: "{{ ansible_user_dir }}/.ssh/config"
    mode: 0600

- name: SSH Allowed Signers
  copy:
    src: allowed_signers
    dest: "{{ ansible_user_dir }}/.ssh/allowed_signers"
    mode: 0600