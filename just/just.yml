---
- name: Install just
  community.general.homebrew:
    name: just
  when: is_macos


- name: Link just Zsh Configuration
  ansible.builtin.include_tasks:
    file: "{{ dotfiles_dir }}/includes/link_zsh_config.yml"
  vars:
    zsh_config_name: just
    zsh_config_src: just/just.zsh
    zsh_config_dest: just.zsh
