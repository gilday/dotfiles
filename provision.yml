---
- name: Provision dotfiles
  hosts: localhost
  connection: local
  vars:
    dotfiles_dir: "{{ playbook_dir }}"
    home_dir: "{{ ansible_facts.user_dir }}"
    is_macos: "{{ ansible_facts.distribution == 'MacOSX' }}"
    is_codespace: "{{ lookup('env', 'CODESPACES') == 'true' }}"
    docuum_threshold: "50 GB"
  tasks:
    - name: Provision core
      ansible.builtin.include_tasks: core/core.yml
      tags: [core]
    - name: Provision ssh
      ansible.builtin.include_tasks: ssh/ssh.yml
      tags: [ssh]
      when: not is_codespace
    - name: Provision git
      ansible.builtin.include_tasks: git/git.yml
      tags: [git]
    - name: Provision git-identity
      ansible.builtin.include_tasks: git-identity/git-identity.yml
      tags: [git-identity]
      when: not is_codespace
    - name: Check if zsh is available
      ansible.builtin.command: which zsh
      register: zsh_check
      failed_when: false
      changed_when: false
      tags: [zsh]
    - name: Provision zsh
      ansible.builtin.include_tasks: zsh/zsh.yml
      when: not is_codespace or zsh_check.rc == 0
      tags: [zsh]
    - name: Provision python
      ansible.builtin.include_tasks: python/python.yml
      tags: [python]
      when: not is_codespace
    - name: Provision java
      ansible.builtin.include_tasks: java/java.yml
      tags: [java]
      when: not is_codespace
    - name: Provision node
      ansible.builtin.include_tasks: node/node.yml
      tags: [node]
      when: not is_codespace
    - name: Provision ruby
      ansible.builtin.include_tasks: ruby/ruby.yml
      tags: [ruby]
      when: not is_codespace
    - name: Provision vim
      ansible.builtin.include_tasks: vim/vim.yml
      tags: [vim]
    - name: Provision vscode
      ansible.builtin.include_tasks: vscode/vscode.yml
      tags: [vscode]
    - name: Provision macos
      ansible.builtin.include_tasks: macos/macos.yml
      when: is_macos and not is_codespace
      tags: [macos]
    - name: Provision aws
      ansible.builtin.include_tasks: aws/aws.yml
      tags: [aws]
      when: not is_codespace
    - name: Provision github
      ansible.builtin.include_tasks: github/github.yml
      tags: [github]
      when: not is_codespace
    - name: Provision sentry
      ansible.builtin.include_tasks: sentry/sentry.yml
      tags: [sentry]
      when: not is_codespace
    - name: Provision docuum
      ansible.builtin.include_tasks: docuum/docuum.yml
      tags: [docuum]
      when: not is_codespace
    - name: Provision 1password
      ansible.builtin.include_tasks: 1password/1password.yml
      tags: [1password]
      when: not is_codespace
    - name: Provision ghostty
      ansible.builtin.include_tasks: ghostty/ghostty.yml
      tags: [ghostty]
      when: not is_codespace
    - name: Provision just
      ansible.builtin.include_tasks: just/just.yml
      tags: [just]
      when: not is_codespace
    - name: Provision claude
      ansible.builtin.include_tasks: claude/claude.yml
      tags: [claude]
      when: not is_codespace
  handlers:
    - name: Print ECR Docker configuration instructions
      ansible.builtin.debug:
        msg: |
          ⚠️  Amazon ECR Docker Credential Helper installed!

          To use it with your AWS ECR registries, add the following to ~/.docker/config.json:

          {
            "credHelpers": {
              "public.ecr.aws": "ecr-login",
              "<aws_account_id>.dkr.ecr.<region>.amazonaws.com": "ecr-login"
            }
          }

          Replace <aws_account_id> and <region> with your actual values.
          You can configure multiple ECR registries by adding more entries.
