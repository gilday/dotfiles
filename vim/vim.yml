---
- name: Install vimrc
  ansible.builtin.file:
    state: link
    src: "{{ dotfiles_dir }}/vim/vimrc"
    dest: "{{ home_dir }}/.vimrc"
  register: vimrc_result


- name: Create ~/.vim/autoload Directory
  ansible.builtin.file:
    path: "{{ home_dir }}/.vim/autoload"
    state: directory
    mode: "0755"


- name: Install vim plug
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
    dest: "{{ home_dir }}/.vim/autoload/plug.vim"
    mode: "0644"
  register: vim_plug_result


- name: Reminder to install Vim plugins
  ansible.builtin.debug:
    msg: |
      ⚠️  Vim configuration changed! To install plugins and avoid color scheme errors:
      1. Open vim: vim
      2. Run: :PlugInstall
      3. Quit when done: :q
  when: vimrc_result.changed or vim_plug_result.changed
