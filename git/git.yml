---
# Git configuration (safe for all environments)
- name: Link gitconfig
  file:
    state: link
    src: "{{ dotfiles_dir }}/git/gitconfig"
    dest: "{{ ansible_user_dir }}/.gitconfig"
    force: yes

- name: Link gitconfig-pixee
  file:
    state: link
    src: "{{ dotfiles_dir }}/gitconfig-pixee"
    dest: "{{ ansible_user_dir }}/.gitconfig-pixee"
    force: yes

- name: Install gitmoji
  homebrew:
    name: gitmoji
  when: ansible_distribution == 'MacOSX'

- name: Install git-absorb
  homebrew:
    name: git-absorb
  when: ansible_distribution == 'MacOSX'