---
# Bespoke signing identity for Claude Code sessions.
#
# Source of truth: 1Password SSH Key item at
# op://Employee/Claude Code Signing in the pixee.1password.com account
# (item UUID 7iox6e7jvxyycjhgqn52i6dhmi). The private key is piped from
# 1Password directly into ssh-add via stdin and never touches disk.
# The public key is written to ~/.ssh/claude-agent-signing.pub for
# inspection convenience; the canonical reference for signing config is
# the inline pubkey in claude-signing/gitconfig-claude.
#
# Threat-model note: this identity is intentionally lower-trust than the
# personal 1Password-managed key. It can only forge commits; it does NOT
# authenticate to GitHub or anything else. Compromise blast radius is small,
# and the key is independently revocable on GitHub.
#
# Claude Code subprocesses pick up SSH_AUTH_SOCK + GIT_CONFIG_GLOBAL from
# claude/managed-settings.yml.j2.
#
# Provisioning requires `op signin --account pixee` and that 1Password's
# "Integrate with 1Password CLI" toggle is enabled in Settings → Developer.

- name: Read agent public key from 1Password
  ansible.builtin.command: op --account pixee.1password.com read --no-newline "op://Employee/Claude Code Signing/public_key"
  register: agent_public_key
  changed_when: false

- name: Write agent public key
  ansible.builtin.copy:
    content: "{{ agent_public_key.stdout }} claude-agent-signing\n"
    dest: "{{ home_dir }}/.ssh/claude-agent-signing.pub"
    mode: "0644"

- name: Make wrapper script executable
  ansible.builtin.file:
    path: "{{ dotfiles_dir }}/claude-signing/claude-ssh-agent"
    mode: "0755"

- name: Render LaunchAgent plist
  ansible.builtin.template:
    src: com.gilday.claude-ssh-agent.plist.j2
    dest: "{{ home_dir }}/Library/LaunchAgents/com.gilday.claude-ssh-agent.plist"
    mode: "0644"

- name: Check whether LaunchAgent is already loaded
  ansible.builtin.command: launchctl list com.gilday.claude-ssh-agent
  register: launchctl_check
  changed_when: false
  failed_when: false

- name: Load LaunchAgent
  ansible.builtin.command: launchctl load -w {{ home_dir }}/Library/LaunchAgents/com.gilday.claude-ssh-agent.plist
  when: launchctl_check.rc != 0

- name: Wait for ssh-agent socket
  ansible.builtin.wait_for:
    path: "{{ home_dir }}/.ssh/claude-agent.sock"
    timeout: 5

- name: Ensure key is loaded in the agent (pipe from 1Password)
  ansible.builtin.shell: |
    set -euo pipefail
    export SSH_AUTH_SOCK="{{ home_dir }}/.ssh/claude-agent.sock"
    if /usr/bin/ssh-add -l 2>/dev/null | grep -q -F "{{ agent_public_key.stdout.split()[1] }}"; then
      exit 0
    fi
    op --account pixee.1password.com read --no-newline \
       "op://Employee/Claude Code Signing/private_key?ssh-format=openssh" \
      | /usr/bin/ssh-add -
  changed_when: "'Identity added' in result.stdout"
  register: result

- name: Link gitconfig-claude
  ansible.builtin.file:
    state: link
    src: "{{ dotfiles_dir }}/claude-signing/gitconfig-claude"
    dest: "{{ home_dir }}/.gitconfig-claude"
    force: yes
