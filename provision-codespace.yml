---
# Ansible playbook for GitHub Codespaces configuration
# This playbook only includes configuration tasks that don't require:
# - Package installations
# - Sudo access
# - Interactive prompts
- hosts: localhost
  connection: local
  vars:
    dotfiles_dir: "{{ playbook_dir }}"
  tasks:
    # Core configuration - directory setup and basic dotfiles
    - ansible.builtin.include_tasks: core/core.yml
      tags: [core]

    # Git configuration - aliases and safe settings only
    - ansible.builtin.include_tasks: git/git.yml
      tags: [git]

    # Zsh configuration - only if zsh is already available
    - name: Check if zsh is available
      ansible.builtin.command: which zsh
      register: zsh_check
      failed_when: false
      changed_when: false

    - ansible.builtin.include_tasks: zsh/zsh.yml
      when: zsh_check.rc == 0
      tags: [zsh]

    # Vim configuration - vimrc and vim-plug setup
    - ansible.builtin.include_tasks: vim/vim.yml
      tags: [vim]

    # VS Code shell integration (minimal config)
    - ansible.builtin.include_tasks: vscode/vscode.yml
      tags: [vscode]
