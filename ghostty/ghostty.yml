---
- name: Configure Ghostty terminal
  block:
    - name: Ensure Ghostty config directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/Library/Application Support/com.mitchellh.ghostty"
        state: directory
        mode: '0755'

    - name: Check if Ghostty config exists
      ansible.builtin.stat:
        path: "{{ dotfiles_dir }}/ghostty/config"
      register: ghostty_config_file

    - name: Link Ghostty configuration
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/ghostty/config"
        dest: "{{ ansible_facts.env.HOME }}/Library/Application Support/com.mitchellh.ghostty/config"
        state: link
        force: yes
      when: ghostty_config_file.stat.exists
