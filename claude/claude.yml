---
# Claude Code is installed via Anthropic's native installer rather than a
# Homebrew cask. Homebrew deletes the previous version directory on upgrade,
# which yanks the binary out from under any long-running Claude Code session
# whose Agent spawner resolved `claude` to that absolute Caskroom path
# (anthropics/claude-code#48889). The native installer updates in place via a
# background auto-updater, so running sessions never see the binary disappear.
- name: Uninstall Claude Code Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: absent
  loop:
    - claude-code
    - claude-code@latest
  when: is_macos

- name: Install Claude Code via native installer
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
    creates: "{{ home_dir }}/.local/bin/claude"
    executable: /bin/bash

- name: Ensure Claude config directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.claude"
    state: directory
    mode: '0755'

# .env loading moved from a local SessionStart hook to the dotenv plugin
# (dotenv@gilday-claude-plugins). Remove the now-dangling symlink to the
# deleted local script.
- name: Remove legacy load-dotenv hook symlink
  ansible.builtin.file:
    path: "{{ home_dir }}/.claude/hooks/load-dotenv.sh"
    state: absent

# The settings merge below is additive (combine), so it cannot by itself drop
# the SessionStart entry it used to inject for the local hook. Prune any
# load-dotenv SessionStart hook before the merge reads the file, without
# touching externally managed hooks (e.g. PostToolUse/Stop).
- name: Remove legacy load-dotenv SessionStart hook from Claude settings
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f="{{ home_dir }}/.claude/settings.json"
      [ -f "$f" ] || exit 0
      before=$(cat "$f")
      after=$(printf '%s' "$before" | jq '
        if (.hooks.SessionStart | type) == "array" then
          .hooks.SessionStart |= map(select(
            any(.hooks[]?.command // ""; contains("load-dotenv")) | not))
        else . end
        | if (.hooks | has("SessionStart")) and (.hooks.SessionStart == [])
          then del(.hooks.SessionStart) else . end
        | if (.hooks // {}) == {} then del(.hooks) else . end')
      if [ "$before" != "$after" ]; then
        printf '%s\n' "$after" > "$f"
        echo CHANGED
      fi
  register: dotenv_hook_prune
  changed_when: "'CHANGED' in dotenv_hook_prune.stdout"

- name: Ensure Claude settings file exists
  ansible.builtin.copy:
    content: "{}\n"
    dest: "{{ home_dir }}/.claude/settings.json"
    force: false
    mode: "0600"

- name: Find Claude skill scripts to exclude from sandbox
  ansible.builtin.find:
    paths:
      - "{{ home_dir }}/.claude/skills"
      - "{{ home_dir }}/.claude/plugins/cache/pixee-internal-claude-plugins"
    patterns: "*.sh"
    recurse: true
  register: claude_sandbox_scripts

- name: Read existing Claude settings
  ansible.builtin.slurp:
    src: "{{ home_dir }}/.claude/settings.json"
  register: claude_settings_raw

- name: Merge managed settings into existing
  ansible.builtin.set_fact:
    claude_merged: >-
      {{ (claude_settings_raw.content | b64decode | from_json)
         | combine(lookup('template', dotfiles_dir + '/claude/managed-settings.yml.j2') | from_yaml,
                   recursive=True, list_merge='append_rp') }}

- name: Apply managed Claude settings
  ansible.builtin.copy:
    content: "{{ claude_merged | to_nice_json(indent=2) }}\n"
    dest: "{{ home_dir }}/.claude/settings.json"
    mode: "0600"

# Bespoke signing identity for Claude Code sessions (macOS only).
#
# Source of truth: 1Password SSH Key item at
# op://Employee/Claude Code in the pixee.1password.com account
# (item UUID 7iox6e7jvxyycjhgqn52i6dhmi). The private key is piped from
# 1Password directly into ssh-add via stdin and never touches disk.
# The public key is written to ~/.ssh/claude-agent-signing.pub for
# inspection convenience; the canonical reference for signing config is
# the inline pubkey in claude/gitconfig-claude.
#
# Threat-model note: this identity is registered on GitHub for both
# signing and authentication, so a leak grants push access in addition
# to forged commits. Blast radius is bounded by independent revocation
# (separate 1Password item, separate GitHub key registration) and by
# the fact that it only activates inside Claude Code subprocesses.
#
# Claude Code subprocesses pick up SSH_AUTH_SOCK + GIT_CONFIG_GLOBAL from
# managed-settings.yml.j2 above.
#
# Provisioning requires `op signin --account pixee` and that 1Password's
# "Integrate with 1Password CLI" toggle is enabled in Settings → Developer.
- name: Configure Claude Code signing identity
  when: is_macos
  block:
    - name: Read agent public key from 1Password
      ansible.builtin.command: op --account pixee.1password.com read --no-newline "op://Employee/Claude Code/public_key"
      register: agent_public_key
      changed_when: false

    - name: Write agent public key
      ansible.builtin.copy:
        content: "{{ agent_public_key.stdout }} claude-agent-signing\n"
        dest: "{{ home_dir }}/.ssh/claude-agent-signing.pub"
        mode: "0644"

    - name: Make wrapper script executable
      ansible.builtin.file:
        path: "{{ dotfiles_dir }}/claude/claude-ssh-agent"
        mode: "0755"

    - name: Render LaunchAgent plist
      ansible.builtin.template:
        src: com.gilday.claude-ssh-agent.plist.j2
        dest: "{{ home_dir }}/Library/LaunchAgents/com.gilday.claude-ssh-agent.plist"
        mode: "0644"
      register: claude_launchagent_plist

    - name: Check whether LaunchAgent is already loaded
      ansible.builtin.command: launchctl list com.gilday.claude-ssh-agent
      register: launchctl_check
      changed_when: false
      failed_when: false

    # launchctl caches the plist in-memory at load time. If the on-disk plist
    # changed (e.g., the script path was renamed), we must unload first or the
    # next restart will exec the stale path.
    - name: Unload stale LaunchAgent (plist changed)
      ansible.builtin.command: launchctl unload {{ home_dir }}/Library/LaunchAgents/com.gilday.claude-ssh-agent.plist
      when: claude_launchagent_plist.changed and launchctl_check.rc == 0
      changed_when: true

    - name: Load LaunchAgent
      ansible.builtin.command: launchctl load -w {{ home_dir }}/Library/LaunchAgents/com.gilday.claude-ssh-agent.plist
      when: launchctl_check.rc != 0 or claude_launchagent_plist.changed
      changed_when: true

    - name: Wait for ssh-agent socket
      ansible.builtin.wait_for:
        path: "{{ home_dir }}/.ssh/claude-agent.sock"
        timeout: 5

    - name: Ensure key is loaded in the agent (pipe from 1Password)
      ansible.builtin.shell: |
        set -euo pipefail
        export SSH_AUTH_SOCK="{{ home_dir }}/.ssh/claude-agent.sock"
        if /usr/bin/ssh-add -l 2>/dev/null | grep -q -F "{{ agent_public_key.stdout.split()[1] }}"; then
          exit 0
        fi
        op --account pixee.1password.com read --no-newline \
           "op://Employee/Claude Code/private_key?ssh-format=openssh" \
          | /usr/bin/ssh-add -
      changed_when: "'Identity added' in result.stdout"
      register: result

    - name: Link gitconfig-claude
      ansible.builtin.file:
        state: link
        src: "{{ dotfiles_dir }}/claude/gitconfig-claude"
        dest: "{{ home_dir }}/.gitconfig-claude"
        force: true

- name: Link Claude Zsh Configuration
  ansible.builtin.include_tasks:
    file: "{{ dotfiles_dir }}/includes/link_zsh_config.yml"
  vars:
    zsh_config_name: Claude
    zsh_config_src: claude/claude.zsh
    zsh_config_dest: claude.zsh
