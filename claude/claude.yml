---
- name: Ensure Claude config directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.claude"
    state: directory
    mode: '0755'

- name: Ensure Claude settings file exists
  ansible.builtin.copy:
    content: "{}\n"
    dest: "{{ home_dir }}/.claude/settings.json"
    force: no

- name: Find Claude skill scripts to exclude from sandbox
  ansible.builtin.find:
    paths:
      - "{{ home_dir }}/.claude/skills"
      - "{{ home_dir }}/.claude/plugins/cache/pixee-internal-claude-plugins"
    patterns: "*.sh"
    recurse: yes
  register: claude_sandbox_scripts

- name: Read existing Claude settings
  ansible.builtin.slurp:
    src: "{{ home_dir }}/.claude/settings.json"
  register: claude_settings_raw

- name: Merge managed settings into existing
  ansible.builtin.set_fact:
    claude_merged: >-
      {{ (claude_settings_raw.content | b64decode | from_json)
         | combine(lookup('template', dotfiles_dir + '/claude/managed-settings.yml.j2') | from_yaml,
                   recursive=True, list_merge='append_rp') }}

- name: Apply managed Claude settings
  ansible.builtin.copy:
    content: "{{ claude_merged | to_nice_json(indent=2) }}\n"
    dest: "{{ home_dir }}/.claude/settings.json"
