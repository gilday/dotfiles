---
# Core configuration module - basic directories and dotfiles
- name: User bin
  file:
    path: "{{ ansible_user_dir}}/bin"
    state: directory

- name: Development Tools Directory
  file:
    path: "{{ ansible_user_dir }}/devtools"
    state: directory

- name: Link basic dotfiles
  file:
    state: link
    src: "{{ dotfiles_dir }}/{{ item }}"
    dest: "{{ ansible_user_dir }}/.{{ item }}"
    force: yes
  loop:
    - ackrc
    - screenrc

- name: Bin Scripts Dir
  file:
    state: directory
    path: "{{ ansible_user_dir }}/bin"

- name: Bin Scripts
  file:
    state: link
    src: "{{ dotfiles_dir }}/bin/{{ item }}"
    dest: "{{ ansible_user_dir }}/bin/{{ item }}"
  loop:
    - echo-server.py
    - tcp-proxy.sh

- name: Download Nord Dircolors
  git:
    repo: https://github.com/nordtheme/dircolors.git
    dest: "{{ ansible_user_dir }}/.dircolors-nord"
    depth: 1
  tags: [config]

- name: Set Nord Directory Color Scheme
  file:
    path: "{{ ansible_user_dir }}/.dir_colors"
    state: link
    src: "{{ ansible_user_dir }}/.dircolors-nord/src/dir_colors"
  tags: [config]

