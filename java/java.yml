---
- name: Install OpenJDK LTS
  homebrew_cask:
    name:
      - temurin@17
      - temurin@21
      - temurin
  when: ansible_distribution == 'MacOSX'


- name: Install Maven
  homebrew:
    name: maven
  when: ansible_distribution == 'MacOSX'


- name: Install Eclipse JDT Language Server
  homebrew:
    name: jdtls
  when: ansible_distribution == 'MacOSX'


- name: Tap GNG
  homebrew_tap:
    name: gdubw/gng
  when: ansible_distribution == 'MacOSX'


- name: Install GNG
  homebrew:
    name: gng
  when: ansible_distribution == 'MacOSX'


- name: Link Java Zsh Configuration
  file:
    state: link
    src: "{{ dotfiles_dir }}/java/java.zsh"
    dest: "{{ ansible_user_dir }}/.oh-my-zsh/custom/java.zsh"
