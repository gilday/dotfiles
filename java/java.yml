---
- name: Install OpenJDK LTS
  community.general.homebrew_cask:
    name:
      - temurin@17
      - temurin@21
      - temurin
  when: is_macos


- name: Install Maven
  community.general.homebrew:
    name: maven
  when: is_macos


- name: Install Eclipse JDT Language Server
  community.general.homebrew:
    name: jdtls
  when: is_macos


- name: Tap GNG
  community.general.homebrew_tap:
    name: gdubw/gng
  when: is_macos


# Homebrew 6+ refuses to load formulae from non-official taps unless the tap is
# trusted (brew trust). Trust gdubw/gng so `Install GNG` works on fresh machines.
- name: Read Trusted Homebrew Taps
  ansible.builtin.command:
    cmd: brew trust --json v1
  register: brew_trust
  changed_when: false
  when: is_macos


- name: Trust GNG
  ansible.builtin.command:
    cmd: brew trust --tap gdubw/gng
  changed_when: true
  when:
    - is_macos
    - "'gdubw/gng' not in (brew_trust.stdout | from_json).taps"


- name: Install GNG
  community.general.homebrew:
    name: gng
  when: is_macos


- name: Link Java Zsh Configuration
  ansible.builtin.include_tasks:
    file: "{{ dotfiles_dir }}/includes/link_zsh_config.yml"
  vars:
    zsh_config_name: Java
    zsh_config_src: java/java.zsh
    zsh_config_dest: java.zsh
