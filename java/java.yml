---
- name: Install OpenJDK LTS
  homebrew_cask:
    name:
      - temurin@11
      - temurin@17
      - temurin@21
      - temurin
  when: ansible_distribution == 'MacOSX'


- name: Install Maven
  unarchive:
    remote_src: yes
    src: https://dlcdn.apache.org/maven/maven-3/3.9.10/binaries/apache-maven-3.9.10-bin.zip
    dest: "{{ ansible_user_dir }}/devtools"


- name: Link Maven
  file:
    path: "{{ ansible_user_dir }}/devtools/maven"
    state: link
    src: "apache-maven-3.9.10"


- name: Tap GNG
  homebrew_tap:
    name: gdubw/gng
  when: ansible_distribution == 'MacOSX'


- name: Install GNG
  homebrew:
    name: gng
  when: ansible_distribution == 'MacOSX'


- name: Link Java Zsh Configuration
  file:
    state: link
    src: "{{ dotfiles_dir }}/java/java.zsh"
    dest: "{{ ansible_user_dir }}/.oh-my-zsh/custom/java.zsh"
