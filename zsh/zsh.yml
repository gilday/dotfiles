---
- name: Check if .zshrc exists
  ansible.builtin.stat:
    path: "{{ home_dir }}/.zshrc"
  register: zshrc_stat

- name: Backup existing .zshrc in Codespaces
  ansible.builtin.copy:
    src: "{{ home_dir }}/.zshrc"
    dest: "{{ home_dir }}/.zshrc.codespaces-backup"
    remote_src: true
    mode: "0644"
  when:
    - zshrc_stat.stat.exists
    - lookup('env', 'CODESPACES') == 'true'

- name: Install Oh My ZSH  # noqa: latest[git]
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ home_dir }}/.oh-my-zsh"
    version: HEAD


- name: Link zshrc
  ansible.builtin.file:
    state: link
    src: "{{ dotfiles_dir }}/zsh/zshrc"
    dest: "{{ home_dir }}/.zshrc"
    force: true


- name: Link zprofile
  ansible.builtin.file:
    state: link
    src: "{{ dotfiles_dir }}/zsh/zprofile"
    dest: "{{ home_dir }}/.zprofile"
    force: true


- name: Link Aliases and Functions
  ansible.builtin.file:
    state: link
    src: "{{ dotfiles_dir }}/zsh/aliases.zsh"
    dest: "{{ home_dir }}/.oh-my-zsh/custom/aliases.zsh"


- name: Link Theme
  ansible.builtin.file:
    state: link
    src: "{{ dotfiles_dir }}/zsh/gilday.zsh-theme"
    dest: "{{ home_dir }}/.oh-my-zsh/custom/gilday.zsh-theme"


- name: Install logcli plugin
  ansible.builtin.file:
    state: link
    src: "{{ dotfiles_dir }}/zsh/plugins/logcli"
    dest: "{{ home_dir }}/.oh-my-zsh/custom/plugins/logcli"


- name: Install zsh-autosuggestions  # noqa: latest[git]
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ home_dir }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    version: HEAD


- name: Create Dracula Dir If Not Exists
  ansible.builtin.file:
    path: "{{ home_dir }}/dracula"
    state: directory
    mode: "0755"


- name: Download Dracula Theme  # noqa: latest[git]
  ansible.builtin.git:
    repo: https://github.com/dracula/zsh.git
    dest: "{{ home_dir }}/dracula/zsh"
    version: HEAD


- name: Install Dracula Theme
  ansible.builtin.file:
    path: "{{ home_dir }}/.oh-my-zsh/themes/dracula.zsh-theme"
    state: link
    src: "{{ home_dir }}/dracula/zsh/dracula.zsh-theme"


- name: Ensure Dracula theme subdirectory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.oh-my-zsh/themes/dracula"
    state: directory
    mode: "0755"


- name: Link Dracula async lib
  ansible.builtin.file:
    path: "{{ home_dir }}/.oh-my-zsh/themes/dracula/lib"
    state: link
    src: "{{ home_dir }}/dracula/zsh/lib"
    force: true
