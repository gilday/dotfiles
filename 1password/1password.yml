---
- name: Install 1Password CLI
  homebrew:
    name: 1password-cli
  when: ansible_distribution == 'MacOSX'


- name: Link 1Password Zsh Configuration
  file:
    state: link
    src: "{{ dotfiles_dir }}/1password/1password.zsh"
    dest: "{{ ansible_user_dir }}/.oh-my-zsh/custom/1password.zsh"

